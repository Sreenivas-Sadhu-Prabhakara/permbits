<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* 512×512 icon — the 755 bit grid, rust on oatmeal, 12% safe padding for maskable */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body {
    background: linear-gradient(160deg, #F7F1E6 0%, #F4EEE2 55%, #EDE4D2 100%);
    display: grid; place-items: center;
  }
  .grid {
    width: 384px; height: 384px; /* ~75% => >12% safe padding all round */
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 22px;
  }
  .c {
    border-radius: 26px;
    background: #A83E1C;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.12), 0 10px 22px -12px rgba(43,36,32,0.45);
  }
  .off {
    background: #E8DFCC;
    border: 3px solid #D9CDB9;
    box-shadow: none;
  }
</style>
</head>
<body>
  <!-- 755 = rwx r-x r-x -->
  <div class="grid">
    <div class="c"></div><div class="c"></div><div class="c"></div>
    <div class="c"></div><div class="c off"></div><div class="c"></div>
    <div class="c"></div><div class="c off"></div><div class="c"></div>
  </div>
</body>
</html>
